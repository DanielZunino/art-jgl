<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>ART JGL Construcciones</title>
<style>
:root{--gold:#FDB225;--gold-d:#E09A0B;--ink:#111;--paper:#fff;--bg:#F4F1EA;--line:#111;--mut:#5b5b5b;--ok:#1E7B34;--bad:#C0392B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.35}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header.top{background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;border-bottom:4px solid var(--gold)}
header.top img{width:44px;height:auto;display:block}
header.top .t{flex:1;min-width:0}
header.top .t b{display:block;font-size:15px;letter-spacing:.4px;text-transform:uppercase}
header.top .t span{font-size:13px;color:#cfcfcf}
header.top button{background:none;border:2px solid var(--gold);color:var(--gold);font-weight:700;padding:8px 12px;font-size:14px}
header.top[hidden],.prog[hidden]{display:none}
header.top img{background:#fff;padding:2px}
.hero img{background:#fff;padding:6px}
.gh b{flex:1;min-width:0}.gh span{flex:none;white-space:nowrap}
.prog{height:8px;background:#ddd}.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}
main{max-width:720px;margin:0 auto;padding:14px}
h2{margin:6px 0 4px;font-size:22px;text-transform:uppercase;letter-spacing:.3px}
p.sub{margin:0 0 14px;color:var(--mut)}
.card{background:var(--paper);border:2px solid var(--line);padding:12px;margin:0 0 12px}
label.f{display:block;font-weight:700;margin:0 0 4px;font-size:15px}
input[type=text],input[type=time],textarea,select{width:100%;font:inherit;padding:13px;border:2px solid var(--line);background:#fff;border-radius:0}
textarea{min-height:96px;resize:vertical}
.row{margin-bottom:12px}
.ro{background:#eee;border:2px solid var(--line);padding:13px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sel{background:#fff;border:2px solid var(--line);padding:8px 6px 10px;text-align:center;font:inherit;font-weight:700;font-size:14px;position:relative;min-height:128px;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;color:var(--ink)}
.sel svg{width:62px;height:62px}
.sel.on{background:var(--gold);box-shadow:inset 0 0 0 3px var(--ink)}
.sel.on::after{content:"✓";position:absolute;top:4px;right:6px;font-size:20px;font-weight:900}
.gh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px}
.gh b{text-transform:uppercase;font-size:14px;letter-spacing:.4px}
.mini{background:#fff;border:2px solid var(--line);padding:8px 12px;font:inherit;font-weight:700;font-size:14px;color:var(--ink)}
.mini.k{background:var(--ink);color:var(--gold)}
.big{width:100%;min-height:58px;font:inherit;font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.4px;border:2px solid var(--line);background:var(--gold);color:var(--ink);padding:12px}
.big.d{background:var(--ink);color:#fff}.big.w{background:#fff}
.note{background:#FFF4D1;border:2px solid var(--gold-d);padding:10px;margin:0 0 12px;font-size:15px}
.err{background:#fde8e6;border:2px solid var(--bad);color:#7a1a10;padding:10px;margin:0 0 12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1.5px solid var(--line);padding:3px 8px;font-size:13px;background:#fff;font-weight:600}
.chip.g{background:var(--gold)}
.src{border:2px solid var(--line);margin:0 0 14px;background:#fff}
.src>.hd{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:8px 10px}
.src>.hd svg{width:44px;height:44px;background:#fff;flex:none}
.src>.hd b{flex:1;font-size:15px;text-transform:uppercase}
.src>.bd{padding:10px}
.ctl{display:flex;gap:10px;align-items:flex-start;padding:11px 8px;border-bottom:1px solid #ccc;cursor:pointer;user-select:none}
.ctl:last-of-type{border-bottom:0}
.box{flex:none;width:30px;height:30px;border:2.5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;line-height:1}
.ctl.on .box,.pick.on .box{background:var(--gold)}
.ctl.on .box::after,.pick.on .box::after{content:"✓"}
.ctl.miss{background:#fde8e6}
.pick{display:flex;gap:12px;align-items:center;padding:14px 10px;border:2px solid var(--line);background:#fff;margin:0 0 8px;cursor:pointer;user-select:none}
.pick .nm{flex:1;font-weight:700}.pick .sm{font-size:13px;color:var(--mut);font-weight:400;display:block}
.pick.miss{background:#fde8e6}
.addrow{display:flex;gap:8px;margin-top:10px}.addrow input{flex:1}
.addrow button{flex:none}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{position:relative;border:2px solid var(--line);background:#fff}.ph img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.ph button{position:absolute;top:4px;right:4px;width:38px;height:38px;border:2px solid var(--ink);background:var(--gold);font-weight:900;font-size:18px}
.sg{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;padding:10px;margin:0 0 8px}
.sg .nm{flex:1;font-weight:700}.sg .sm{font-size:13px;color:var(--mut);display:block;font-weight:400}
.sg img{height:44px;width:auto;border:1px solid #bbb;background:#fff}
.st{font-weight:800;font-size:14px}.st.ok{color:var(--ok)}.st.no{color:var(--bad)}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);border-top:4px solid var(--gold);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:30}
nav.bar button{flex:1;min-height:56px;font:inherit;font-weight:800;font-size:17px;text-transform:uppercase;border:2px solid var(--gold);background:var(--gold);color:var(--ink)}
nav.bar button.sec{background:var(--ink);color:var(--gold);flex:.6}
nav.bar[hidden]{display:none}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.ovl[hidden]{display:none}
.dlg{background:#fff;border:3px solid var(--gold);width:100%;max-width:680px;padding:14px}
.dlg h3{margin:0 0 4px;text-transform:uppercase}
canvas.pad{width:100%;height:230px;border:2px solid var(--ink);background:#fff;touch-action:none;display:block}
.dlg .acts{display:flex;gap:8px;margin-top:10px}.dlg .acts button{flex:1;min-height:52px;font:inherit;font-weight:800;border:2px solid var(--ink);background:#fff;text-transform:uppercase}
.dlg .acts .k{background:var(--gold)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(100px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-left:6px solid var(--gold);padding:12px;z-index:60;font-weight:700}
.toast[hidden]{display:none}
.hist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ccc;font-size:15px}
.hist a{color:var(--ink);font-weight:800}
.sum dt{font-weight:800;font-size:13px;text-transform:uppercase;color:var(--mut);margin-top:8px}.sum dd{margin:0 0 2px}
.hero{background:var(--ink);color:#fff;padding:22px 16px;text-align:center;border-bottom:6px solid var(--gold);margin:-14px -14px 14px}
.hero img{width:120px;height:auto;display:block;margin:0 auto 10px}
.hero h1{margin:0;font-size:24px;text-transform:uppercase;letter-spacing:.5px}
.hero p{margin:4px 0 0;color:#cfcfcf}
.spin{width:46px;height:46px;border:6px solid #ddd;border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:6px auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.tip{display:flex;gap:10px;align-items:center;background:#FFF4D1;border:2px solid var(--gold-d);padding:8px 10px;margin:0 0 12px;font-size:15px;font-weight:600}
.tip button{flex:none;width:46px;height:46px;border:2px solid var(--ink);background:var(--gold);display:flex;align-items:center;justify-content:center;padding:0}
.tip button svg{width:26px;height:26px}
header.top button#btnVoz{padding:8px 10px}
#dedo{position:fixed;z-index:45;width:36px;height:50px;pointer-events:none;transition:left .25s,top .25s}
#dedo[hidden]{display:none}
#dedo.dn{transform:rotate(180deg)}
#dedo.lf{transform:rotate(-90deg)}
#dedo svg{display:block;width:36px;height:50px;animation:dd .9s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
@keyframes dd{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <img src="logo.png" alt="JGL Construcciones">
  <div class="t"><b id="tTitle">ART</b><span id="tSub"></span></div>
  <button id="btnVoz" type="button">Voz sí</button>
  <button id="btnHome" type="button">Inicio</button>
</header>
<div class="prog" id="prog" hidden><i id="progBar"></i></div>
<main id="view"></main>
<nav class="bar" id="nav" hidden>
  <button class="sec" id="bBack" type="button">Atrás</button>
  <button id="bNext" type="button">Siguiente</button>
</nav>
<div class="ovl" id="ovl" hidden></div>
<div class="toast" id="toast" hidden></div>

function rutLimpio(r){return String(r||"").replace(/[^0-9kK]/g,"").toUpperCase()}
function rutOk(r){const c=rutLimpio(r);if(c.length<8||c.length>9)return false;const cu=c.slice(0,-1),dv=c.slice(-1);let s=0,m=2;for(let i=cu.length-1;i>=0;i--){s+=+cu[i]*m;m=m===7?2:m+1}const e=11-(s%11);const x=e===11?"0":e===10?"K":String(e);return x===dv}
function rutFmt(r){const c=rutLimpio(r);if(c.length<2)return c;return c.slice(0,-1).replace(/\B(?=(\d{3})+(?!\d))/g,".")+"-"+c.slice(-1)}

function nomina(){ return CONFIG.nomina.concat(LS.get("art_nomina",[])); }
function trabajadorPorId(id){ return nomina().find(w=>w.id===id); }

/* aprendizaje simple: lo más usado sale primero; las medidas que se agregan quedan sugeridas */
function stat(tipo,id){ const s=LS.get("art_stats",{}); return (s[tipo+":"+id]||0); }
function sumarStats(){ const s=LS.get("art_stats",{}); D.trabajos.forEach(i=>s["t:"+i]=(s["t:"+i]||0)+1); D.equipos.forEach(i=>s["e:"+i]=(s["e:"+i]||0)+1); LS.set("art_stats",s); }
function ordenado(ids,tipo){ return ids.map((id,i)=>({id,i})).sort((a,b)=>(stat(tipo,b.id)-stat(tipo,a.id))||(a.i-b.i)).map(x=>x.id); }
function customDe(id){ return LS.get("art_custom",{})[id]||[]; }

function fuentes(){
  const out=[];
  D.trabajos.forEach(id=>{const t=TR[id];const ctl=t.ctl.concat(customDe("t_"+id)); if(ctl.length) out.push({k:"t_"+id,n:t.n,ico:t.ico,riesgos:t.riesgos,ctl,epp:t.epp,proc:t.proc,permiso:t.permiso});});
  D.equipos.forEach(id=>{const e=EQ[id];const ctl=e.ctl.concat(customDe("e_"+id)); if(ctl.length) out.push({k:"e_"+id,n:e.n,ico:id,riesgos:e.riesgos,ctl,epp:e.epp,proc:e.proc||"",permiso:""});});
  return out;
}
function eppLista(){

  if(s.has("Casco con barbiquejo")) s.delete("Casco de seguridad");
  if([...s].some(x=>/^Calzado de seguridad .+/.test(x))) s.delete("Calzado de seguridad");

}

function procLista(){
  const s=new Set(); D.trabajos.forEach(id=>{const t=TR[id]; if(t.proc)s.add(t.proc); (t.imp||[]).forEach(i=>{if(TR[i].proc)s.add(TR[i].proc)})}); D.equipos.forEach(id=>{if(EQ[id].proc)s.add(EQ[id].proc)});

function normN(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }
function buscarPersona(nombre){
  const t=normN(nombre).split(/\s+/).filter(Boolean); if(!t.length) return null;
  return nomina().concat(Object.values(D.extra)).find(w=>{const n=normN(w.nombre); return t.every(x=>n.includes(x));})||null;
}
function personas(){
  const jm=buscarPersona(D.jefe), sm=buscarPersona(D.supervisor);
  const p=[{id:"jefe",nombre:jm?jm.nombre:D.jefe,rut:jm?jm.rut:"",rol:"Jefe de cuadrilla",req:true}];
  D.workers.forEach(id=>{ if(jm&&id===jm.id) return; const w=D.extra[id]||trabajadorPorId(id); if(w) p.push({id,nombre:w.nombre,rut:w.rut,rol:w.cargo||"Trabajador",req:true,fuera:!!D.extra[id]}); });
  const mismoQueJefe = normN(D.supervisor)===normN(D.jefe) || (sm&&jm&&sm.id===jm.id);
  const yaTrabajador = sm && D.workers.includes(sm.id);
  if(D.supervisor && !mismoQueJefe && !yaTrabajador) p.push({id:"sup",nombre:sm?sm.nombre:D.supervisor,rut:sm?sm.rut:"",rol:"Supervisor a cargo",req:false});
  return p;
}

function textoPaso(){

  if(step===2) return "Marque el tipo de trabajo que van a hacer hoy. Puede marcar más de uno. Después toque Siguiente.";

}

  try{

    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt); u.lang="es-CL"; u.rate=.95;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(x=>/^es[-_]CL/i.test(x.lang))||vs.find(x=>/^es/i.test(x.lang)); if(v) u.voice=v;
    speechSynthesis.speak(u);

}

function apuntar(centrar){
  const d=$("#dedo"); if(!d) return;
  if(!D||step<1||step>8){ d.hidden=true; return; }
  const t=objetivoDedo(); if(!t){ d.hidden=true; return; }
  const esNav=t.id==="bNext";
  if(centrar&&!esNav){ const r0=t.getBoundingClientRect(); if(r0.top>innerHeight-150) t.scrollIntoView({block:"center"}); }
  const r=t.getBoundingClientRect(), vh=window.innerHeight, navTop=vh-92;
  if(!esNav && (r.bottom<70 || r.top>navTop-10)){ d.hidden=true; return; }
  d.classList.remove("dn","lf");
  let x,y;
  if(esNav){ x=r.left+r.width/2-18; y=r.top-56; d.classList.add("dn"); }
  else { const cx=r.right-Math.min(40,r.width/2), cy=r.top+Math.min(r.height/2,34); x=cx-18; y=cy-25; d.classList.add("lf"); }
  x=Math.max(2,Math.min(x,innerWidth-40));
  d.style.left=x+"px"; d.style.top=Math.max(50,y)+"px"; d.hidden=false;
}

function faltaCtl(){ let n=0; fuentes().forEach(f=>f.ctl.forEach((c,i)=>{if(!D.ctl[f.k+":"+i])n++})); return n; }
function validar(n){
  if(n===1){ if(!D.obra.trim())return "Escriba la obra o lugar de trabajo."; if(!D.jefe.trim())return "Escriba el jefe de cuadrilla."; if(!D.supervisor.trim())return "Escriba el supervisor a cargo."; if(!D.descripcion.trim())return "Escriba qué trabajo van a hacer hoy."; }
  if(n===2 && !D.trabajos.length) return "Marque al menos un tipo de trabajo.";
  if(n===4 && !D.workers.length) return "Marque al menos un trabajador.";
  if(n===5){
    const ps=paginasR(), pg=ps[Math.min(sub,ps.length-1)];
    if(pg.t==="f"){ const m=pg.f.ctl.filter((c,i)=>!D.ctl[pg.f.k+":"+i]).length; if(m) return "Faltan "+m+" medidas por verificar. Están marcadas en rojo."; }
    else { const pe=permisosLista().filter(p=>!D.permisos[p]); if(pe.length) return "Falta confirmar el permiso: "+pe[0]+"."; if(!D.epp) return "Falta confirmar el equipo de protección personal del personal."; }
  }
  if(n===8){ const f=personas().filter(p=>p.req&&!D.firmas[p.id]); if(f.length) return "Falta la firma de: "+f.map(p=>p.nombre).join(", ")+"."; }
  return null;
}

  if(step===1){ const o=LS.get("art_obras",[]), s=LS.get("art_sups",[]); if(!o.includes(D.obra.trim()))o.unshift(D.obra.trim()); if(!s.includes(D.supervisor.trim()))s.unshift(D.supervisor.trim()); LS.set("art_obras",o.slice(0,12)); LS.set("art_sups",s.slice(0,12)); LS.set("art_ult",{obra:D.obra.trim(),jefe:D.jefe.trim(),supervisor:D.supervisor.trim()}); }
  if(step===8){ generar(); return; }
  if(step===5){ const t=paginasR().length; if(sub<t-1){ sub++; guardarBorrador(); render(false); return; } }
  go(step+1);
});

function abrirFirma(id){

  o.innerHTML=`<div class="dlg"><h3>${esc(p.nombre)}</h3><div style="color:var(--mut);margin-bottom:8px">${esc(p.rol)}${p.rut?" · "+esc(p.rut):""} — firme con el dedo</div><canvas class="pad" id="pad"></canvas><div class="acts"><button type="button" id="sB">Borrar</button><button type="button" id="sC">Cancelar</button><button type="button" class="k" id="sG">Guardar</button></div></div>`;
  o.hidden=false;
  const cv=$("#pad"), r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1; cv.width=r.width*dpr; cv.height=r.height*dpr;
  const g=cv.getContext("2d"); g.scale(dpr,dpr); g.lineWidth=2.6; g.lineCap="round"; g.lineJoin="round"; g.strokeStyle="#111";
  let dib=false, tocado=false, lx=0, ly=0;
  const pos=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener("pointerdown",e=>{dib=true;[lx,ly]=pos(e);cv.setPointerCapture(e.pointerId);g.beginPath();g.moveTo(lx,ly);g.lineTo(lx+.1,ly+.1);g.stroke();tocado=true;e.preventDefault()});
  cv.addEventListener("pointermove",e=>{if(!dib)return;const [x,y]=pos(e);g.beginPath();g.moveTo(lx,ly);g.lineTo(x,y);g.stroke();lx=x;ly=y;e.preventDefault()});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>cv.addEventListener(ev,()=>dib=false));
  $("#sB").onclick=()=>{g.clearRect(0,0,cv.width,cv.height);tocado=false};
  $("#sC").onclick=()=>{o.hidden=true;o.innerHTML=""};
  $("#sG").onclick=()=>{ if(!tocado){toast("Falta la firma.");return;} D.firmas[id]=recortar(cv); guardarBorrador(); o.hidden=true;o.innerHTML=""; pintarFirmas(); };
}
function recortar(cv){
  const g=cv.getContext("2d"), w=cv.width, h=cv.height, d=g.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){ if(d[(y*w+x)*4+3]>20){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  const m=12; x0=Math.max(0,x0-m); y0=Math.max(0,y0-m); x1=Math.min(w,x1+m); y1=Math.min(h,y1+m);
  const c=document.createElement("canvas"); c.width=Math.max(1,x1-x0); c.height=Math.max(1,y1-y0);
  c.getContext("2d").drawImage(cv,x0,y0,c.width,c.height,0,0,c.width,c.height);
  return firmaLiviana(c);
}

// 23-11-2026: firma liviana (la planilla corta sobre ~49.000 caracteres)
function firmaLiviana(cv){ const W=Math.min(480,cv.width), H=Math.round(cv.height*W/cv.width); const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d'); x.drawImage(cv,0,0,W,H); let s=c.toDataURL('image/png'); if(s.length<40000) return s; x.globalCompositeOperation='destination-over'; x.fillStyle='#fff'; x.fillRect(0,0,W,H); for(const q of [0.85,0.7,0.5,0.35]){ s=c.toDataURL('image/jpeg',q); if(s.length<40000) return s; } return s; }

/* ---------- PDF ---------- */
function cargarImg(src){ return new Promise((ok,no)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=src;}); }
async function svgPng(acc,px){
  const s=svg(acc,px); const im=await cargarImg("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s));
  const c=document.createElement("canvas"); c.width=px; c.height=px; const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,px,px); g.drawImage(im,0,0,px,px); return c.toDataURL("image/png");
}
async function sha256(txt){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }

function descargarBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500); }
function aB64(blob){ return new Promise(ok=>{const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]); r.readAsDataURL(blob);}); }

function nombreART(n){ const d=new Date(D.fecha+"T12:00:00"); return "ART "+pad2(n)+" "+DIAS[d.getDay()]+" "+fechaCL(d); }
async function siguienteNro(){
  if(CONFIG.endpoint){
    try{ const r=await fetch(CONFIG.endpoint+"?accion=siguiente&fecha="+encodeURIComponent(D.fecha)); const j=await r.json(); if(j&&j.ok&&j.n) return j.n; }catch(e){}
  }
  const ym=D.fecha.slice(0,7); return LS.get("art_hist",[]).filter(x=>x.fecha&&x.fecha.slice(0,7)===ym).length+1;
}
async function generar(){
  const o=$("#ovl"); o.innerHTML=`<div class="dlg" style="text-align:center"><div class="spin"></div><b>Generando el ART…</b><div style="color:var(--mut);margin-top:4px">No cierre esta pantalla.</div></div>`; o.hidden=false;
  try{
    const ahora=new Date(), fcl=fechaCL(new Date(D.fecha+"T12:00:00"));
    const n=await siguienteNro();
    let nombre=nombreART(n), folio=nombre;
    const selloTxt=fechaCL(ahora)+" a las "+pad2(ahora.getHours())+":"+pad2(ahora.getMinutes())+" h";
    const hash=await sha256(JSON.stringify({d:D,folio,selloTxt}));
    const doc=await construirPDF(folio,hash,selloTxt);
    const blob=doc.output("blob");
    let url="", drive=false, copia=false, archivo=nombre+".pdf";
    if(CONFIG.endpoint){
      try{
        const res=await fetch(CONFIG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:CONFIG.token,fecha:D.fecha,nombre:archivo,pdf:await aB64(blob)})});
        const j=await res.json();
        if(j&&j.ok){ drive=true; url=j.url||""; archivo=j.nombre||archivo; copia=!!j.copia; }
      }catch(e){}
    }
    sumarStats();
    const h=LS.get("art_hist",[]); h.unshift({file:archivo,obra:D.obra,url,fecha:D.fecha}); LS.set("art_hist",h.slice(0,30));
    if(!drive) descargarBlob(blob,archivo);
    hechoInfo={file:archivo,url,drive,copia,blob,fechaCL:fcl};
    try{localStorage.removeItem("art_draft")}catch(_){}
    o.hidden=true; o.innerHTML=""; go(9);
  }catch(e){
    o.innerHTML=`<div class="dlg"><h3>No se pudo generar</h3><p>Ocurrió un problema al armar el PDF. Sus datos siguen guardados en este teléfono. Intente de nuevo.</p><div class="acts"><button type="button" class="k" id="eOk">Entendido</button></div></div>`; $("#eOk").onclick=()=>{o.hidden=true;o.innerHTML=""};
    console.error(e&&e.target&&e.target.src?('Imagen que no carga: '+String(e.target.src).slice(0,90)):(e&&e.stack?e.stack:e));
  }
}
